
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Time-travel | COM 370 Exercise 8</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Time-travel</h1>

  <main>


    <button class="travel-button future" type="button">
      <span class="normal-text">Button to the Future</span>
      <span class="secret-text">Welcome to the year 3026!</span>
    </button>


    <button class="travel-button present" type="button">
      Button to the Present
    </button>


    <button class="travel-button past" type="button">
      Button to the Past
    </button>


    <section class="sunrise" aria-label="Sunrise illustration">
      <div class="sun"></div>
      <p>Sunrise</p>
    </section>

  </main>

</body>
</html>
