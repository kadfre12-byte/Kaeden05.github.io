<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-Class Exercise #3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="content">
      <h1>Imagine, if you can</h1>

      <p class="opening">
        a small room, <span class="hexagon">HEXAGONAL</span> in shape,<br>
        like the cell of a bee.
      </p>

      <p class="lighting">It is lighted neither by window nor by lamp,</p>

      <p id="radiance">yet it is filled with a soft radiance.</p>

      <p class="ending">
        There are no apertures for ventilation, yet the air is
        <span class="fresh">fresh</span>.
      </p>
    </div>
  </main>
</body>
</html>
